<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصال قطع است — مرکز رز</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: Vazirmatn, Tahoma, sans-serif; background:#fdf1f5; color:#22262e; }
  .box { max-width:420px; text-align:center; background:#fff; border-radius:18px; padding:36px 28px;
         box-shadow:0 12px 34px rgba(194,24,91,.14); }
  .rose { font-size:52px; line-height:1; }
  h1 { font-size:1.25rem; color:#c2185b; margin:14px 0 8px; }
  p { font-size:.9rem; color:#5a616e; line-height:1.9; margin:0 0 18px; }
  button { border:none; background:#c2185b; color:#fff; font-family:inherit; font-weight:700;
           padding:11px 28px; border-radius:999px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#8e1147; }
  .ltr-tip { font-size:.75rem; color:#8b93a1; margin-top:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="rose">🌹</div>
  <h1>اتصال اینترنت قطع است</h1>
  <p>شما در حالت آفلاین هستید. صفحاتی که قبلاً بازدید کرده‌اید همچنان در دسترس‌اند.<br>پس از برقراری اتصال، صفحه را دوباره بارگذاری کنید.</p>
  <button onclick="location.reload()">تلاش دوباره</button>
  <p class="ltr-tip">Offline — You are not connected. Pages you visited before remain available.</p>
</div>
