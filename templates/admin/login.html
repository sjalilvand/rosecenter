<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت - مرکز رز</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="لوگو" class="login-logo">
    <h1>پنل مدیریت</h1>
    <p class="muted">مرکز خدمات روانشناسی و مشاوره رز</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash flash-{{ category }}"><span>{{ '✅' if category == 'success' else '⚠️' }} {{ message }}</span></div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="form">
      <div class="form-group">
        <label for="username">نام کاربری</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
    </form>
    <a href="{{ url_for('main.home') }}" class="back-link">← بازگشت به سایت</a>
  </div>
</body>
</html>
