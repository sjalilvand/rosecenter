{% extends 'admin/base.html' %}
{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
<div class="page-head">
  <h1>🔑 تغییر رمز عبور</h1>
  <p>برای امنیت بیشتر، رمز عبور پیش‌فرض را تغییر دهید</p>
</div>

<div class="panel form-panel narrow-panel">
  <form method="post" class="form">
    <div class="form-group">
      <label for="current_password">رمز عبور فعلی <span class="req">*</span></label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="form-group">
      <label for="new_password">رمز عبور جدید <span class="req">*</span></label>
      <input type="password" id="new_password" name="new_password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm_password">تکرار رمز عبور جدید <span class="req">*</span></label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">تغییر رمز عبور</button>
    </div>
  </form>
</div>
{% endblock %}
