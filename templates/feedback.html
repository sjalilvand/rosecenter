{% extends "base.html" %}
{% block content %}
<section class="page-hero">
  <div class="container">
    <h1>پیشنهاد و انتقاد</h1>
    <nav class="breadcrumb"><a href="{{ url_for('home') }}">خانه</a><span class="sep">/</span><span>پیشنهاد و انتقاد</span></nav>
    <p class="lead">نظر شما برای ما ارزشمند است؛ با ثبت پیشنهاد یا انتقاد خود به بهبود کیفیت خدمات کمک کنید.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:720px">
    <div class="form-card">
      <form method="post" action="{{ url_for('feedback') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="form-row">
          <div class="field">
            <label>نام (اختیاری)</label>
            <input type="text" name="name" placeholder="نام شما">
          </div>
          <div class="field">
            <label>راه تماس (اختیاری)</label>
            <input type="text" name="contact" placeholder="شماره تماس یا ایمیل" dir="ltr" style="text-align:right">
          </div>
        </div>
        <div class="field">
          <label>نوع پیام <span class="req">*</span></label>
          <div class="radio-grid" style="grid-template-columns:repeat(3,1fr)">
            <label class="radio-pill"><input type="radio" name="kind" value="پیشنهاد" checked><span>پیشنهاد</span></label>
            <label class="radio-pill"><input type="radio" name="kind" value="انتقاد"><span>انتقاد</span></label>
            <label class="radio-pill"><input type="radio" name="kind" value="گزارش تخلف"><span>گزارش تخلف</span></label>
          </div>
        </div>
        <div class="field">
          <label>متن پیام <span class="req">*</span></label>
          <textarea name="message" required placeholder="متن پیشنهاد یا انتقاد خود را بنویسید..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">ثبت پیام</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
